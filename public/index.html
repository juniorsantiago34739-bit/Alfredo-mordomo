<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>Alfred — Mordomo Virtual</title>
<style>
:root{--bg:#050914;--panel:#0a1220;--panel2:#0d1828;--line:#1e3550;--text:#f5f8ff;--muted:#8da1b8;--accent:#5bc7ff;--accent2:#8b7cff;--user:#164a72}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#18385a 0,#0b182a 28%,var(--bg) 62%);color:var(--text);min-height:100vh}.app{width:min(1120px,100%);margin:auto;padding:18px}.card{height:calc(100vh - 36px);min-height:600px;position:relative;background:rgba(7,14,25,.88);border:1px solid #203650;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px #000b;display:flex;flex-direction:column;backdrop-filter:blur(18px)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(91,199,255,.07),transparent 35%,rgba(139,124,255,.05) 70%,transparent)}
.top{position:relative;z-index:2;padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;background:rgba(7,15,27,.78);backdrop-filter:blur(14px)}.avatar{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#142b43,#0a1422);border:1px solid #2d5879;font-size:27px;box-shadow:inset 0 0 20px #52c7ff12,0 8px 25px #0005}.title{flex:1}.title h1{margin:0;font-size:21px;letter-spacing:.3px}.title p{margin:3px 0 0;color:var(--muted);font-size:12px}.online{display:inline-flex;align-items:center;gap:6px;margin-top:5px;color:#77d9a4;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#63dda0;box-shadow:0 0 10px #63dda0}.actions{display:flex;gap:8px}.icon{border:1px solid #28425d;background:#0d1a2a;color:#eaf5ff;border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:17px;transition:.2s}.icon:hover{transform:translateY(-1px);border-color:#4d87b0;background:#13263c}
.status{position:relative;z-index:1;font-size:11px;color:#72c9f2;margin:9px 24px 0;min-height:16px}.chat{position:relative;z-index:1;flex:1;overflow:auto;padding:18px 22px 28px;scroll-behavior:smooth}.chat::-webkit-scrollbar{width:7px}.chat::-webkit-scrollbar-thumb{background:#213852;border-radius:10px}.welcome{max-width:680px;margin:8vh auto 0;text-align:center;color:#a9b8ca}.welcome .big{width:92px;height:92px;margin:auto;display:grid;place-items:center;border-radius:28px;font-size:48px;background:radial-gradient(circle,#173d5b,#0b1726 70%);border:1px solid #2e5977;box-shadow:0 0 55px #4ac7ff14}.welcome h2{margin:18px 0 7px;font-size:27px;color:#fff}.welcome p{margin:0;color:#8fa4ba}.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:24px}.chip{border:1px solid #28445e;background:#0d1a2a;color:#dceeff;border-radius:13px;padding:10px 14px;cursor:pointer;transition:.2s}.chip:hover{background:#13283e;border-color:#4d789b;transform:translateY(-1px)}.msg{max-width:min(76%,760px);padding:13px 16px;margin:12px 0;border-radius:18px;white-space:pre-wrap;line-height:1.55;word-wrap:break-word;box-shadow:0 7px 22px #0002}.user{margin-left:auto;background:linear-gradient(135deg,#15547f,#173e67);border:1px solid #28678f;border-bottom-right-radius:5px}.assistant{background:linear-gradient(135deg,#111f30,#0e1927);border:1px solid #243b53;border-bottom-left-radius:5px}.typing{display:inline-flex;gap:5px}.typing i{width:6px;height:6px;background:#8da9c0;border-radius:50%;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}
.composer{position:relative;z-index:3;padding:14px 18px 17px;border-top:1px solid var(--line);background:rgba(6,13,23,.94);backdrop-filter:blur(15px)}.row{display:flex;gap:9px;align-items:flex-end}.composer textarea{flex:1;resize:none;border:1px solid #29425c;border-radius:16px;background:#0b1726;color:#fff;padding:13px 14px;min-height:50px;max-height:140px;outline:none;font:inherit;transition:.2s}.composer textarea::placeholder{color:#687f97}.composer textarea:focus{border-color:#4e9bc6;box-shadow:0 0 0 3px #3da9df12}.btn{border:1px solid #4b91b9;border-radius:15px;min-height:50px;padding:0 19px;background:linear-gradient(135deg,#2180b4,#385cc0);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 8px 22px #1c6fa533;transition:.2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.hint{text-align:center;color:#5f7389;font-size:10px;margin-top:8px}
.panel{display:none;position:absolute;right:20px;top:78px;width:min(340px,calc(100% - 40px));background:rgba(10,19,32,.97);border:1px solid #2b4964;border-radius:18px;padding:17px;box-shadow:0 25px 60px #000c;z-index:10}.panel.show{display:block}.panel h3{margin:0 0 12px}.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1e3044;font-size:13px}.setting:last-child{border:0}.danger{background:#73313b;border-color:#9b4b57;min-height:38px;padding:0 13px}.toggle{width:47px;height:26px;border-radius:99px;border:0;background:#33465a;cursor:pointer;padding:3px}.toggle span{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:#278ac0}.toggle.on span{transform:translateX(21px)}
@media(max-width:600px){.app{padding:0}.card{height:100vh;border-radius:0;border:0}.top{padding:13px 14px}.avatar{width:47px;height:47px}.title h1{font-size:19px}.chat{padding:13px 13px 22px}.msg{max-width:89%}.status{margin-left:17px}.actions .icon{width:38px;height:38px}.composer{padding:10px}.btn{padding:0 14px}.welcome{margin-top:7vh}.welcome h2{font-size:23px}.chips{margin-top:18px}}
</style></head>
<body><main class="app"><section class="card"><header class="top"><div class="avatar">🤵</div><div class="title"><h1>Alfred</h1><p>Mordomo virtual • Assistente pessoal</p><div class="online"><span class="dot"></span> Sistema online</div></div><div class="actions"><button class="icon" id="voiceBtn" title="Voz">🔊</button><button class="icon" id="settingsBtn" title="Configurações">⚙️</button></div></header><div id="status" class="status">Pronto para atender.</div><div id="panel" class="panel"><h3>⚙️ Configurações</h3><div class="setting"><span>🔊 Responder por voz</span><button class="toggle on" id="voiceToggle"><span></span></button></div><div class="setting"><span>🧠 Memória local</span><button class="toggle on" id="memoryToggle"><span></span></button></div><div class="setting"><span>🗑️ Limpar conversa</span><button class="btn danger" id="clearBtn">Limpar</button></div></div><div id="chat" class="chat"></div><div class="composer"><div class="row"><button id="mic" class="icon" title="Microfone">🎙️</button><textarea id="input" placeholder="Como posso ajudar, senhor?" rows="1"></textarea><button id="send" class="btn">Enviar ➤</button></div><div class="hint">Enter envia • Shift+Enter quebra linha</div></div></section></main>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),mic=document.getElementById('mic'),statusEl=document.getElementById('status'),panel=document.getElementById('panel'),voiceToggle=document.getElementById('voiceToggle'),memoryToggle=document.getElementById('memoryToggle');
let memory=localStorage.getItem('alfred_memory')!=='off';let voice=localStorage.getItem('alfred_voice')!=='off';let history=memory?JSON.parse(localStorage.getItem('alfred_history')||'[]'):[];
function toggle(el,on){el.classList.toggle('on',on)}toggle(voiceToggle,voice);toggle(memoryToggle,memory);
function render(){chat.innerHTML='';if(!history.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="big">🤵</div><h2>Boa noite. Eu sou Alfred.</h2><p>Seu mordomo virtual está pronto para ajudar.</p><div class="chips"><button class="chip">💡 Me dê uma ideia</button><button class="chip">📚 Me ajude a estudar</button><button class="chip">💻 Ajude com tecnologia</button></div>';chat.appendChild(w);chat.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.textContent.replace(/^\S+\s/,'');ask()});return}history.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.content;chat.appendChild(d)});chat.scrollTop=chat.scrollHeight}
function save(){if(memory)localStorage.setItem('alfred_history',JSON.stringify(history.slice(-40)))}function add(role,content){history.push({role,content});save();render()}render();
function typing(){const d=document.createElement('div');d.className='msg assistant';d.id='typing';d.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function ask(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';input.style.height='auto';add('user',text);statusEl.textContent='Alfred está pensando...';send.disabled=true;typing();try{const context=memory?history.slice(-14):history.slice(-4);const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:context})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro');document.getElementById('typing')?.remove();add('assistant',data.reply);if(voice)speak(data.reply);statusEl.textContent='Pronto para atender.'}catch(e){document.getElementById('typing')?.remove();add('assistant','Não consegui responder agora. '+e.message);statusEl.textContent='Erro ao conversar.'}finally{send.disabled=false;input.focus()}}
send.onclick=ask;input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
function speak(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.98;speechSynthesis.speak(u)}
voiceToggle.onclick=()=>{voice=!voice;localStorage.setItem('alfred_voice',voice?'on':'off');toggle(voiceToggle,voice);if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();statusEl.textContent=voice?'Voz ativada.':'Voz desativada.'};voiceBtn.onclick=()=>{voice=!voice;localStorage.setItem('alfred_voice',voice?'on':'off');toggle(voiceToggle,voice);if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();else if(history.at(-1)?.role==='assistant')speak(history.at(-1).content)};
memoryToggle.onclick=()=>{memory=!memory;localStorage.setItem('alfred_memory',memory?'on':'off');toggle(memoryToggle,memory);if(!memory)localStorage.removeItem('alfred_history');statusEl.textContent=memory?'Memória local ativada.':'Memória local desativada.'};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Limpar toda a conversa salva neste navegador?')){history=[];localStorage.removeItem('alfred_history');render();panel.classList.remove('show');statusEl.textContent='Conversa limpa.'}};document.getElementById('settingsBtn').onclick=()=>panel.classList.toggle('show');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='pt-BR';rec.interimResults=false;mic.onclick=()=>{statusEl.textContent='Ouvindo...';mic.disabled=true;try{rec.start()}catch(e){}};rec.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event('input'));statusEl.textContent='Enviando...';ask()};rec.onerror=()=>statusEl.textContent='Microfone indisponível.';rec.onend=()=>mic.disabled=false}else mic.disabled=true;
</script></body></html>
