<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Alfred V3 — Mordomo Virtual</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#1e293b,#080b11 55%);color:#f8fafc;min-height:100vh}.app{width:min(1050px,100%);margin:auto;padding:14px}.card{height:calc(100vh - 28px);min-height:560px;background:#0f141d;border:1px solid #273244;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008;display:flex;flex-direction:column}.top{padding:16px 18px;border-bottom:1px solid #273244;display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#182235;border:1px solid #3b4a63;font-size:24px}.title{flex:1}.title h1{margin:0;font-size:20px}.title p{margin:2px 0 0;color:#9aa8bc;font-size:13px}.actions{display:flex;gap:7px}.icon{border:1px solid #334155;background:#18202c;color:#fff;border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:17px}.icon:hover{background:#223047}.status{font-size:12px;color:#7dd3fc;margin-left:58px;margin-top:-10px;margin-bottom:8px}.chat{flex:1;overflow:auto;padding:20px;scroll-behavior:smooth}.welcome{max-width:650px;margin:35px auto;text-align:center;color:#aab6c8}.welcome .big{font-size:48px}.welcome h2{margin:10px 0 6px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.chip{border:1px solid #334155;background:#151d29;color:#dbeafe;border-radius:999px;padding:9px 13px;cursor:pointer}.msg{max-width:min(78%,720px);padding:13px 15px;margin:11px 0;border-radius:16px;white-space:pre-wrap;line-height:1.5;word-wrap:break-word}.user{margin-left:auto;background:#315c9b}.assistant{background:#1c2532;border:1px solid #293649}.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;background:#94a3b8;border-radius:50%;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}.composer{padding:12px;border-top:1px solid #273244;background:#0c1119}.row{display:flex;gap:8px}.composer textarea{flex:1;resize:none;border:1px solid #334155;border-radius:14px;background:#111925;color:#fff;padding:13px;min-height:48px;max-height:140px;outline:none}.composer textarea:focus{border-color:#4f8cff}.btn{border:0;border-radius:13px;padding:0 17px;background:#3d6fd1;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{text-align:center;color:#68778c;font-size:11px;margin-top:7px}.panel{display:none;position:absolute;right:20px;top:70px;width:min(330px,calc(100% - 40px));background:#111925;border:1px solid #334155;border-radius:16px;padding:16px;box-shadow:0 20px 50px #0009;z-index:5}.panel.show{display:block}.panel h3{margin:0 0 12px}.setting{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #263244}.setting:last-child{border:0}.danger{background:#6b2b35}.toggle{width:46px;height:25px;border-radius:99px;border:0;background:#475569;cursor:pointer;padding:3px}.toggle span{display:block;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:#3d6fd1}.toggle.on span{transform:translateX(21px)}
@media(max-width:600px){.app{padding:0}.card{height:100vh;border-radius:0}.msg{max-width:88%}.top{padding:13px}.chat{padding:14px}.status{margin-left:58px}.actions .icon{width:36px;height:36px}.btn{padding:0 13px}}
</style></head>
<body><main class="app"><section class="card"><header class="top"><div class="avatar">🤵</div><div class="title"><h1>Alfred</h1><p>Mordomo virtual • V3</p></div><div class="actions"><button class="icon" id="voiceBtn" title="Voz">🔊</button><button class="icon" id="settingsBtn" title="Configurações">⚙️</button></div></header><div id="status" class="status">Pronto.</div><div id="panel" class="panel"><h3>Configurações</h3><div class="setting"><span>🔊 Responder por voz</span><button class="toggle on" id="voiceToggle"><span></span></button></div><div class="setting"><span>🧠 Memória local</span><button class="toggle on" id="memoryToggle"><span></span></button></div><div class="setting"><span>🗑️ Limpar conversa</span><button class="btn danger" id="clearBtn">Limpar</button></div></div><div id="chat" class="chat"></div><div class="composer"><div class="row"><button id="mic" class="icon" title="Microfone">🎙️</button><textarea id="input" placeholder="Fale com Alfred..." rows="1"></textarea><button id="send" class="btn">Enviar</button></div><div class="hint">Enter envia • Shift+Enter quebra linha</div></div></section></main>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),mic=document.getElementById('mic'),statusEl=document.getElementById('status'),panel=document.getElementById('panel'),voiceToggle=document.getElementById('voiceToggle'),memoryToggle=document.getElementById('memoryToggle');
let memory=localStorage.getItem('alfred_memory')!=='off';let voice=localStorage.getItem('alfred_voice')!=='off';let history=memory?JSON.parse(localStorage.getItem('alfred_history')||'[]'):[];
function toggle(el,on){el.classList.toggle('on',on)}
toggle(voiceToggle,voice);toggle(memoryToggle,memory);
function render(){chat.innerHTML='';if(!history.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="big">🤵</div><h2>Olá, eu sou Alfred.</h2><div>Seu mordomo virtual está pronto para ajudar.</div><div class="chips"><button class="chip">💡 Me dê uma ideia</button><button class="chip">📚 Me ajude a estudar</button><button class="chip">💻 Ajude com tecnologia</button></div>';chat.appendChild(w);chat.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.textContent.replace(/^\S+\s/,'');ask()});return}history.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.content;chat.appendChild(d)});chat.scrollTop=chat.scrollHeight}
function save(){if(memory)localStorage.setItem('alfred_history',JSON.stringify(history.slice(-40)));}
function add(role,content){history.push({role,content});save();render()}
render();
function typing(){const d=document.createElement('div');d.className='msg assistant';d.id='typing';d.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function ask(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';add('user',text);statusEl.textContent='Alfred está pensando...';send.disabled=true;typing();try{const context=memory?history.slice(-14):history.slice(-4);const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:context})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro');document.getElementById('typing')?.remove();add('assistant',data.reply);if(voice)speak(data.reply);statusEl.textContent='Pronto.'}catch(e){document.getElementById('typing')?.remove();add('assistant','Não consegui falar com a IA agora. '+e.message);statusEl.textContent='Verifique a configuração do servidor.'}finally{send.disabled=false;input.focus()}}
send.onclick=ask;input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
function speak(t){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.98;speechSynthesis.speak(u)}
voiceToggle.onclick=()=>{voice=!voice;localStorage.setItem('alfred_voice',voice?'on':'off');toggle(voiceToggle,voice);if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();statusEl.textContent=voice?'Voz ativada.':'Voz desativada.'};voiceBtn.onclick=()=>{voice=!voice;localStorage.setItem('alfred_voice',voice?'on':'off');toggle(voiceToggle,voice);if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();else if(history.at(-1)?.role==='assistant')speak(history.at(-1).content)};
memoryToggle.onclick=()=>{memory=!memory;localStorage.setItem('alfred_memory',memory?'on':'off');toggle(memoryToggle,memory);if(!memory)localStorage.removeItem('alfred_history');statusEl.textContent=memory?'Memória local ativada.':'Memória local desativada.'};
document.getElementById('clearBtn').onclick=()=>{if(confirm('Limpar toda a conversa salva neste navegador?')){history=[];localStorage.removeItem('alfred_history');render();panel.classList.remove('show');statusEl.textContent='Conversa limpa.'}};document.getElementById('settingsBtn').onclick=()=>panel.classList.toggle('show');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='pt-BR';rec.interimResults=false;mic.onclick=()=>{statusEl.textContent='Ouvindo...';mic.disabled=true;try{rec.start()}catch(e){}};rec.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event('input'));statusEl.textContent='Enviando...';ask()};rec.onerror=()=>statusEl.textContent='Microfone indisponível.';rec.onend=()=>mic.disabled=false}else mic.disabled=true;
</script></body></html>
